name: Chain replay until the final theorem is accepted

on:
  workflow_run:
    workflows: ["Verify twelve-square proof"]
    types: [completed]

permissions:
  contents: read
  actions: write

jobs:
  chain:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Decide whether another resumable run is needed
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir ev && cd ev
          aid=$(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts" --jq '[.artifacts[]|select(.name|startswith("n12-final-evidence"))][0].id')
          test -n "$aid" || { echo "no evidence artifact"; exit 1; }
          gh api "repos/$REPO/actions/artifacts/$aid/zip" > ev.zip
          unzip -q ev.zip replay-stop.json
          proved=$(python3 -c 'import json;print(json.load(open("replay-stop.json")).get("global_optimality_proved") is True)')
          echo "global_optimality_proved=$proved"
          if [ "$proved" = True ]; then echo "accepted; chain ends"; exit 0; fi
          n=$(gh run list --repo "$REPO" --workflow verify.yml --limit 100 --json databaseId --jq length)
          if [ "$n" -ge 12 ]; then echo "chain cap of 12 runs reached"; exit 1; fi
          gh workflow run verify.yml --repo "$REPO" --ref main -f target=N12-jatloe -f jobs=auto -f fresh=false -f resume_run=auto
          echo "dispatched resume run $((n+1))"
