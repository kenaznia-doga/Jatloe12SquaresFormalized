name: Chain replay until the final theorem is accepted

on:
  workflow_run:
    workflows: ["Verify twelve-square proof"]
    types: [completed]

permissions:
  contents: read
  actions: write

jobs:
  chain:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Decide whether another resumable run is needed
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir ev && cd ev
          gh run download "$RUN_ID" --repo "$REPO" --pattern 'n12-final-evidence-*' || { echo "no evidence artifact"; exit 1; }
          f=$(find . -name github-replay.json | head -1)
          test -n "$f" || { echo "no github-replay.json"; exit 1; }
          proved=$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1])).get("global_optimality_proved") is True)' "$f")
          echo "global_optimality_proved=$proved"
          if [ "$proved" = True ]; then echo "accepted; chain ends"; exit 0; fi
          n=$(gh run list --repo "$REPO" --workflow verify.yml --limit 100 --json databaseId --jq length)
          if [ "$n" -ge 12 ]; then echo "chain cap of 12 runs reached"; exit 1; fi
          gh workflow run verify.yml --repo "$REPO" --ref main -f target=N12-jatloe -f jobs=auto -f fresh=false -f resume_run=auto
          echo "dispatched resume run $((n+1))"
